<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>阅读 PDF</title>
<style>
*{box-sizing:border-box}body{margin:0;background:var(--ui-bg);color:var(--ui-text);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
header{height:54px;background:var(--ui-panel);border-bottom:1px solid var(--ui-border);display:flex;align-items:center;gap:14px;padding:0 18px}
button{border:0;border-radius:8px;background:var(--ui-soft);color:var(--ui-text);padding:10px 14px;cursor:pointer;font:inherit}button:hover{background:var(--ui-soft)}button:disabled{opacity:.5;cursor:default}
#title{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}#page{min-width:75px;text-align:center;color:var(--ui-muted)}
#viewport{height:calc(100vh - 116px);overflow:auto;text-align:center;padding:24px;background:var(--ui-bg)}
canvas{display:block;margin:0 auto 20px;box-shadow:0 10px 30px #0008;background:white;max-width:none}
#error{color:#ffb9b9;padding:26px}
footer{height:62px;display:flex;align-items:center;gap:10px;padding:10px 18px;border-top:1px solid var(--ui-border)}#outline{max-width:220px;min-width:100px;margin-right:auto}select,input{font:inherit;background:var(--ui-panel);color:var(--ui-text);border:1px solid var(--ui-border);border-radius:7px;padding:8px}#pageInput{width:65px}#percent{min-width:52px}dialog{background:var(--ui-panel);color:var(--ui-text);border:1px solid var(--ui-border);border-radius:12px}dialog::backdrop{background:#0008}[hidden]{display:none!important}
</style><link rel="stylesheet" href="reader-appearance.css">
<script src="reader-appearance.js" defer></script>
</head><body>
<header><button id="back" title="返回书库">←</button><span id="title"></span><button id="secure" title="加密书库">🔒</button></header>
<div id="viewport"><canvas id="canvas"></canvas><div id="error"></div></div>
<footer><select id="outline" aria-label="章节目录"><option>无书签目录</option></select><button id="return" hidden>返回跳转前</button><button id="prev">上一页</button><button id="page" title="跳转页码"></button><button id="next">下一页</button><span id="percent">0.0%</span></footer>
<dialog id="pageDialog"><form id="pageForm"><label for="pageInput">跳至第</label> <input id="pageInput" type="number" min="1" step="1" required> 页 <button>跳转</button><button type="button" id="cancel">取消</button></form></dialog>
<script type="module">
import * as pdfjsLib from '../node_modules/pdfjs-dist/build/pdf.mjs';
pdfjsLib.GlobalWorkerOptions.workerSrc = new URL('../node_modules/pdfjs-dist/build/pdf.worker.mjs', import.meta.url).href;
const native = window.readerNative;
const viewport = document.getElementById('viewport');
const canvas = document.getElementById('canvas');
const pageLabel = document.getElementById('page');
let loadingTask = null, documentModel = null, pageIndex = 0, activeRender = null, cleared = false, saving, generation = 0, renderVersion = 0, jumpOrigin = null;
const outline = document.getElementById('outline');
function fraction(){return Math.max(0,Math.min(1,viewport.scrollTop/Math.max(1,viewport.scrollHeight-viewport.clientHeight)));}
function status(){if(documentModel)document.getElementById('percent').textContent=(100*(pageIndex+fraction())/documentModel.numPages).toFixed(1)+'%';}
async function loadOutline(model, epoch){
  const items=await model.getOutline();const entries=[];
  async function visit(items,depth){for(const item of items||[]){let dest=item.dest;if(typeof dest==='string')dest=await model.getDestination(dest);if(dest?.length){const index=typeof dest[0]==='number'?dest[0]:await model.getPageIndex(dest[0]);entries.push({title:'　'.repeat(Math.min(depth,3))+item.title,index});}await visit(item.items,depth+1);}}
  await visit(items,0);if(epoch!==generation||cleared)return;
  outline.innerHTML='';outline.add(new Option(entries.length?'章节目录':'无书签目录',''));outline.disabled=!entries.length;
  entries.forEach(entry=>outline.add(new Option(entry.title,String(entry.index))));
}
async function navigate(index,remember=false){
  if(!documentModel||cleared||!Number.isInteger(index)||index<0||index>=documentModel.numPages)return;
  if(remember){jumpOrigin={index:pageIndex,fraction:fraction()};document.getElementById('return').hidden=false;}
  save();pageIndex=index;await draw();save();
}
function save() {
  if (!documentModel || cleared) return;
  status();native.pdfProgress({ position: pageIndex, fraction: fraction() });
}
async function draw(fraction = 0) {
  if (!documentModel || cleared) return;
  const version=++renderVersion, model=documentModel, index=pageIndex;
  if (activeRender) { activeRender.cancel(); try { await activeRender.promise; } catch {} }
  const page = await model.getPage(index + 1);
  if(version!==renderVersion||cleared||model!==documentModel)return;
  const fit = Math.max(0.4, Math.min(2, (viewport.clientWidth - 48) / page.getViewport({ scale: 1 }).width));
  const ratio=Math.min(window.devicePixelRatio || 1, 2), bounds = page.getViewport({ scale: fit*ratio });
  canvas.width = Math.ceil(bounds.width); canvas.height = Math.ceil(bounds.height);
  canvas.style.width = `${Math.ceil(bounds.width / ratio)}px`;
  canvas.style.height = `${Math.ceil(bounds.height / ratio)}px`;
  activeRender = page.render({ canvasContext: canvas.getContext('2d'), viewport: bounds });
  try{await activeRender.promise;}catch(error){if(error.name==='RenderingCancelledException')return;throw error;}
  if(version!==renderVersion||cleared)return;
  pageLabel.textContent = `第 ${index + 1} / ${model.numPages} 页 ▾`;
  document.getElementById('prev').disabled = index === 0;
  document.getElementById('next').disabled = index >= model.numPages - 1;
  viewport.scrollTop = fraction * Math.max(0, viewport.scrollHeight - viewport.clientHeight);status();
}
native.onPdf(async data => {
  try {
    cleared = false;const epoch=++generation;jumpOrigin=null;document.getElementById("return").hidden=true;
    document.getElementById('title').textContent = data.title;
    // Keep large PDFs binary across IPC; expanding a base64 string through
    // Uint8Array.from creates a huge intermediate array and can crash V8.
    const binary = new Uint8Array(data.data);
    const task=pdfjsLib.getDocument({ data: binary });loadingTask=task;
    const model = await task.promise;
    if(epoch!==generation||cleared){await task.destroy();return;}documentModel=model;
    loadOutline(model,epoch).catch(()=>{});
    native.pdfCount(documentModel.numPages);
    pageIndex = Math.max(0, Math.min(documentModel.numPages - 1, data.position || 0));
    await draw(data.fraction || 0);
  } catch (error) { if(cleared)return;document.getElementById('error').textContent = `无法打开 PDF：${error.message}`; }
});
native.onClear(() => {
  cleared = true;generation++;renderVersion++;clearTimeout(saving);jumpOrigin=null;outline.innerHTML='';document.getElementById('return').hidden=true;document.getElementById('pageDialog').close();pageLabel.textContent='';document.getElementById('percent').textContent='';if (activeRender) activeRender.cancel();
  canvas.width = 0; canvas.height = 0; document.getElementById('title').textContent = '';
  document.getElementById('error').textContent = ''; documentModel = null;loadingTask?.destroy().catch(()=>{});loadingTask=null;
});
viewport.addEventListener('scroll', () => { status();clearTimeout(saving); saving = setTimeout(save, 350); });
document.getElementById('prev').onclick = () => navigate(pageIndex-1);
document.getElementById('next').onclick = () => navigate(pageIndex+1);
document.getElementById('back').onclick = () => { save(); native.pdfBack(); };
document.getElementById('secure').onclick = () => { save(); native.pdfSecure(); };
pageLabel.onclick=()=>{if(!documentModel)return;const input=document.getElementById('pageInput');input.max=documentModel.numPages;input.value=pageIndex+1;document.getElementById('pageDialog').showModal();input.focus();input.select();};
document.getElementById('cancel').onclick=()=>document.getElementById('pageDialog').close();
document.getElementById('pageForm').onsubmit=e=>{e.preventDefault();document.getElementById('pageDialog').close();navigate(Number(document.getElementById('pageInput').value)-1,true);};
outline.onchange=()=>{if(outline.value!=='')navigate(Number(outline.value),true);};
document.getElementById('return').onclick=async()=>{if(!jumpOrigin)return;const origin=jumpOrigin;jumpOrigin=null;document.getElementById('return').hidden=true;pageIndex=origin.index;await draw(origin.fraction);save();};
window.addEventListener('resize', () => { if (documentModel) draw(fraction()).catch(() => {}); });
native.pdfReady();
</script></body></html>
