name: Deploy
on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  windows:
    uses: ./.github/workflows/windows.yml
    permissions:
      contents: write

  macos:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Require personal repository and main branch
        run: |
          test "$GITHUB_REPOSITORY" = YouDiSN/fishtouching-reader
          test "$GITHUB_REF" = refs/heads/main
          test "$(uname -m)" = arm64
      - name: Install libsodium
        run: brew install libsodium
      - name: Configure personal signing and notarization
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
          SPARKLE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$CERTIFICATE"
          test -n "$CERTIFICATE_PASSWORD"
          test -n "$NOTARY_KEY"
          test -n "$NOTARY_KEY_ID"
          test -n "$NOTARY_ISSUER"
          test -n "$SPARKLE_KEY"
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -base64 32)
          echo "::add-mask::$keychain_password"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          printf '%s' "$NOTARY_KEY" > "$RUNNER_TEMP/notary.p8"
          printf '%s' "$SPARKLE_KEY" > "$RUNNER_TEMP/sparkle.key"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"
          security find-identity -v -p codesigning "$keychain" | grep -F 'Developer ID Application: Tengjiao Ji (DR4WPFLXBN)'
          xcrun notarytool store-credentials fishtouching-reader --keychain "$keychain" --key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER"
          rm "$RUNNER_TEMP/certificate.p12"
      - name: Build, sign, notarize and verify
        env:
          SIGNING_KEYCHAIN: ${{ runner.temp }}/signing.keychain-db
        run: |
          ./scripts/package-notarized-release.sh 'Developer ID Application: Tengjiao Ji (DR4WPFLXBN)' fishtouching-reader
          dist/*.app/Contents/MacOS/LocalLibrary --self-test
      - name: Sign update feed
        env:
          SPARKLE_PRIVATE_KEY_FILE: ${{ runner.temp }}/sparkle.key
        run: |
          ./scripts/generate-appcast.sh
          cd release
          shasum -a 256 *.dmg *.zip appcast.xml > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: release/
          if-no-files-found: error
      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/sparkle.key" "$RUNNER_TEMP/notary.p8"

  publish:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Publish both platforms together
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node -p 'require("./windows/package.json").version')
          test -f "release/FishTouching-Reader-Windows-x64-v$version.zip"
          test -f "release/fishtouching-reader-macos-arm64-v$version.dmg"
          test -f release/appcast.xml
          python3 scripts/check-release-privacy.py release/*.zip
          cd release
          sha256sum *.dmg *.zip appcast.xml > SHA256SUMS.txt
          gh release create "v$version" --target "$GITHUB_SHA" --title "v$version" --draft --notes-file ../docs/release-notes.md *.dmg *.zip appcast.xml SHA256SUMS.txt
          gh release edit "v$version" --draft=false --latest
